[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default command-line options
addopts =
    -v
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

# Markers map tests back to their user stories for traceability.
markers =
    smoke: Critical happy-path checks.
    login: US-001 / US-002 - authentication.
    products: US-003 / US-004 - product listing and sorting.
    cart: US-005 / US-006 / US-007 - cart management.
    checkout: US-008 / US-009 - checkout flow.
    session: US-010 / US-011 - session and app state.
