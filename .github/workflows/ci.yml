name: CI

# Run on every push and pull request to main, and allow manual runs.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel an in-progress run when a new commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    name: E2E tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    env:
      HEADLESS: "true"          # No display on CI runners.
      # Credentials are injected from GitHub Actions Secrets, never stored in
      # this file. Add them under: Settings > Secrets and variables > Actions.
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      SAUCE_LOCKED_OUT_USER: ${{ secrets.SAUCE_LOCKED_OUT_USER }}
      SAUCE_PROBLEM_USER: ${{ secrets.SAUCE_PROBLEM_USER }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip            # Cache pip downloads keyed on requirements.txt.

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chrome is pre-installed on ubuntu-latest; print versions for traceability.
      # Selenium Manager (bundled with Selenium 4) resolves the matching driver.
      - name: Show browser version
        run: google-chrome --version

      - name: Run the test suite
        run: pytest

      # Always publish the HTML report and any failure screenshots, even on
      # failure, so results can be inspected from the Actions run page.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-py${{ matrix.python-version }}
          path: reports/
          retention-days: 30
